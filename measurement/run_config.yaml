# 測定直前に確定する非凍結値（プレレジ §13）。
# このファイルは測定実行前に値を埋め、コミットしてから capture.py を起動する。
# 確定値が入った状態で v1.1 タグ（prereg-v1.1-frozen）を打つ。

session:
  session_id: TBD            # 例: 2026-04-29_phase1_session01
  operator: Robosheep
  phase: phase1              # phase1 | phase2 | phase3
  start_time_iso: TBD        # 測定開始時刻（ISO 8601, UTC）

# プレレジ §4 hardware.camera.controls.ExposureTime_us
# ROI 輝度がフルスケールの 30–70% に入る値を選定すること。
camera:
  ExposureTime_us: TBD
  AnalogueGain: 1.0
  AwbEnable: false
  AeEnable: false
  frame_rate_fps: 1

# プレレジ §8.2 順序ランダム化のシード。
# numpy.random.default_rng(seed).permutation(condition_ids) で順序確定。
randomization:
  random_seed: TBD           # 測定直前に決定（int）

# プレレジ §5.1 で確定する値。Phase 1 開始前のベースライン測定で埋める。
baseline:
  sigma_baseline: TBD        # std (ddof=1) of 300 frames
  mu_baseline: TBD           # mean of 300 frames
  baseline_session_id: TBD   # ベースラインを測定したセッション ID
  baseline_timestamp_iso: TBD

# 出力先（capture.py がここにフレームを書く）
output:
  raw_dir: data/raw          # data/raw/<session_id>/ 配下に保存
  manifest_filename: manifest.json
